name: 证据纠错
description: 提交证据升级 / 证据降级 / 引用断链 / 等级误标——驱动本仓库的回灌循环
labels: [evidence]
body:
  - type: dropdown
    id: type
    attributes:
      label: 纠错类型
      description: 你提交的是哪一类纠错？
      options:
        - 证据升级（C/D → A/B：找到了更强的一手来源）
        - 证据降级（A/B → C/D：发现利益关联 / 二手转述 / 证据失效）
        - 引用断链（arXiv / DOI / URL 失效）
        - 等级误标（分级与 A/B/C/D 定义不符）
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: 出错位置
      description: 文件 + 章节（如 spec/11-traceability.md 证据完整性子系统行）
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 错误描述
      description: 现状是什么、应该是什么（如「原标 C 级，但已找到 arXiv:xxxx 一手实验」）
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: 正确来源
      description: arXiv / DOI / URL（证据升级或断链时必须提供）
