# 发布一致性校验 + L2 参照实现断言 + tier-0 复现包（CI）
# 动机：verify_consistency.py 与 demo.ts 此前只挂在本地 pre-commit，外部读者无法在远端
#       机器可复现。本 workflow 把 47 项门禁与 153+14 项断言升级为 push/PR 自动执行——
#       让"自动化门禁"从口号变成任何人可核验的事实（采纳豆包深度审查建议 1）。
# 设计约束：脚本零外部依赖（Python 纯标准库 / Node 内置 node:sqlite + node:crypto），
#       故 CI 无需安装任何包；三 job 相互独立，可并行。
# tier-0 复现包 job 的语义：证明「干净 clone 上一条命令可重跑零依赖档标定实验」，
#       把外部复现从人工动作升级为 CI 事实；零密钥、零安装、零网络。
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  consistency-gate:
    name: 发布一致性校验（47 项）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Run verify_consistency.py
        run: python scripts/verify_consistency.py

  calib007-preflight:
    name: CALIB-007 预注册件自检（登记表 37 / manifest 26 / 汇总器 20 / C-0 16，均含反向测试）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      # 为什么单独一个 job：这些脚本此前只在本地跑，外部读者无法确认「白名单登记表 / 攻击 manifest
      # / 统计口径」到底有没有被校验过。放进 CI 后，预注册件的完整性成为任何人可核验的事实。
      - name: 任务池 25 条
        run: python reference/runtimes/l2-runtime-oversight/adapters/autogen/check-task-pool.py
      - name: 白名单登记表（37 项 + 反向测试 13 项）
        run: |
          cd reference/runtimes/l2-runtime-oversight
          python adapters/autogen/check-whitelist-registry.py
          python adapters/autogen/check-whitelist-registry.py --selftest
      - name: 攻击 manifest（26 项 + 反向测试 12 项）
        run: |
          cd reference/runtimes/l2-runtime-oversight
          python adapters/autogen/check-attack-manifest.py
          python adapters/autogen/check-attack-manifest.py --selftest
      - name: 汇总器自检（20 项，含 D-4 取严行为与单调性）
        run: python reference/runtimes/l2-runtime-oversight/aggregate-calib007.py --selftest
      # 为什么加这一步：H5（C3 ≥ 0.80）是「换统计量」的判据，而它的阈值来自留出集，
      # 不是来自任何可外部观察的东西。若定义漂移（例如并列时改成「取第一个」），
      # 所有数值都会静默改变而没人发现。这 16 项里有 5 条反向测试专门钉住 C3 的定义
      # 与三条判定条件，且已用六组突变验证过「改坏必 FAIL」。
      - name: C-0 离线筛选自检（16 项，含 5 条反向测试）
        run: python reference/runtimes/l2-runtime-oversight/adapters/autogen/check-c3-offline.py --selftest

  runtime-tests:
    name: L2 参照实现断言（demo 153 项 + otel 14 项）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run demo.ts (24 组 153 项断言)
        run: node --experimental-transform-types reference/runtimes/l2-runtime-oversight/demo.ts
      - name: Run otel-adapter selftest (14 项)
        run: node --experimental-transform-types reference/runtimes/l2-runtime-oversight/otel-adapter.ts --selftest

  replication-t0:
    name: tier-0 复现包（零依赖档 9 实验）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - name: Selftest comparison kernel (26 项)
        run: node --experimental-transform-types reference/runtimes/l2-runtime-oversight/replicate-t0.mts --selftest
      - name: Replicate tier-0 experiments (9 实验)
        run: node --experimental-transform-types reference/runtimes/l2-runtime-oversight/replicate-t0.mts
      - name: Assert no repo writes (复现不得污染工作区)
        run: git diff --exit-code --stat


  audit-panel:
    name: 审计面板（导出 + 三件独立验证）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ["22", "24"]
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ matrix.node-version }}
      - name: Export deterministic audit events
        run: node --experimental-transform-types tools/audit-panel/scenario/export-events.mts
      - name: Verify chain (独立链验证)
        run: node --experimental-transform-types tools/audit-panel/scenario/verify-chain.mts
      - name: Replay verification (重放校验)
        run: node --experimental-transform-types tools/audit-panel/rules/replay.mts
      - name: Verify realagent (V2 拦截裁决静态复核)
        run: node --experimental-transform-types tools/audit-panel/rules/verify-realagent.mts
